<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Radiance Music: a setting sun with four sound bars standing in it (drums, bass, other, vocals) -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1B3866"/>
      <stop offset="1" stop-color="#0C1D38"/>
    </linearGradient>
    <radialGradient id="glow" cx="64" cy="69.8" r="71.9" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFAE63" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFAE63" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="32.7" x2="0" y2="102.3" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFDB94"/>
      <stop offset="1" stop-color="#F38A35"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="87.2" x2="0" y2="105.8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0C1D38" stop-opacity="0"/>
      <stop offset="1" stop-color="#0C1D38"/>
    </linearGradient>
    <clipPath id="round">
