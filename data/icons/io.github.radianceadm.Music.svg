    <rect x="6" y="6" width="116" height="116" fill="url(#glow)"/>
    <circle cx="64" cy="67.5" r="34.8" fill="url(#sun)"/>
    <g stroke="#0C1D38" stroke-width="5.8" stroke-linecap="round">
      <path d="M50.7 73.3V112.7"/>
      <path d="M59.6 60.5V112.7"/>
      <path d="M68.4 67.5V112.7"/>
      <path d="M77.3 77.9V112.7"/>
    </g>
    <rect x="6" y="87.2" width="116" height="34.8" fill="url(#sea)"/>
