[package]
name = "radiance-music-server"
version = "0.2.0"
edition = "2021"
description = "Radiance Music Server (RMS): your own server for Radiance Music. It splits songs, keeps your library and holds listening parties, for you and the friends you invite"
license = "GPL-3.0-or-later"
publish = false

# its own crate, next to the app (not a workspace member: the app's crate stays as it is)
[workspace]

[lib]
name = "rms"
path = "src/lib.rs"

[[bin]]
name = "rms"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "fs", "time", "sync", "io-util", "signal"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
mime = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
getrandom = "0.3"
percent-encoding = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# the splitter's first-start downloads (fetch.rs): ureq as the app's (rustls), its archives
ureq = "3"
zip = { version = "9.3", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
# the splitter: ONNX Runtime, loaded at run time from models/ (as the app's engine); its CUDA provider
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["load-dynamic", "std", "cuda"] }
# word timing: align.py's accents off (NFKD)
unicode-normalization = "0.1"

# the splitter's thread at the lowest priority (nice 19)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart"] }
tokio-tungstenite = "0.29"

[profile.release]
lto = "thin"
