[package]
name = "radiance-ffi"
# the Windows app's own version line (its beta), not the engine's
version = "0.8.0-beta.2"
edition.workspace = true
license.workspace = true
description = "Radiance Music's engine for the Windows app (C# + WinUI 3), through uniffi"
publish = false

[lib]
name = "radiance_ffi"
crate-type = ["cdylib", "lib"]

[dependencies]
radiance-engine = { path = "../engine", default-features = false }
radiance-core = { path = "../core" }
# uniffi-bindgen-cs v0.11.1 targets uniffi 0.31.0 exactly (its README's table), as the POS app
uniffi = "=0.31.0"
thiserror = "2"
