[package]
name = "radiance-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Radiance Music's engine: sources, the player, parts, effects, lyrics, library, splitting, servers (no screens)"
publish = false

[lib]
name = "radiance_engine"

[dependencies]
# the pure behaviour (core/): songs, lyrics, …
radiance-core = { path = "../core" }
glib = "0.22"
gio = "0.22"
gst = { package = "gstreamer", version = "0.25" }
gst-app = { package = "gstreamer-app", version = "0.25" }
realfft = "3.5"
async-channel = "2"
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.41", features = ["bundled"] }
libc = "0.2"
ureq = { version = "3", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# a Radiance Music Server's listening party (its WebSocket); rustls, as ureq's (it builds for Windows with mingw)
tungstenite = { version = "0.29", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
# the feedback pop-up's sign-in (feedback.rs): PKCE's S256 and its random secrets
sha2 = "0.10"
# the two-part split's ONNX Runtime comes in a .tgz / .zip (two_part.rs)
flate2 = "1"
getrandom = "0.3"
# Share Songs with a Phone: the QR's modules (both apps draw them their own way)
qrcode = { version = "0.14", default-features = false }
# splitting without Python (owner 2026-11-02): the two-part split (spleeter.rs, #43) and the
# Demucs prototype (onnx_split.rs) as ONNX, as the phone runs them; ONNX Runtime's library is
# loaded at run time (not linked; two_part.rs fetches it), so builds don't need it
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["load-dynamic", "std"] }
# the GTK app's music videos: GTK 4's paintable (player.rs load_video)
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"], optional = true }

[features]
default = []
# the GTK app's video sink (a GdkPaintable); the Windows app (WinUI) shows videos its own way
gtk = ["dep:gtk", "dep:gst-plugin-gtk4"]
onnx-split = []
save-youtube = []

[target.'cfg(windows)'.dependencies]
# Windows: GStreamer's GTK 4 video sink comes inside the app (Fedora's Windows GStreamer has none)
gst-plugin-gtk4 = { version = "0.15", features = ["gtk_v4_14"], optional = true }
# the splitter pack, downloaded at the first start (setup::install_pack): unpacked and checked
zip = { version = "9.3", default-features = false, features = ["deflate"] } # 9.0.5+: Dependabot #1-#3 (#36)
# the two-part split's Visual C++ runtime, loaded from its folder before ONNX Runtime (spleeter.rs)
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }
# the feedback sign-in's token: Windows' Credential Manager
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }

# Linux: the feedback sign-in's token in the Secret Service (GNOME Keyring, KWallet), pure Rust
[target.'cfg(not(windows))'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["async-secret-service", "async-io", "crypto-rust"] }
