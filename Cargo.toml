[package]
name = "radiance-music"
version = "0.7.16"
edition = "2021"
description = "Search any song and play it: lossless from free libraries first, YouTube Music as the fallback; likes are saved, with synced lyrics, album art and your EQ"
license = "GPL-3.0-or-later"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }
gst = { package = "gstreamer", version = "0.25" }
gst-app = { package = "gstreamer-app", version = "0.25" }
realfft = "3.5"
async-channel = "2"
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.41", features = ["bundled"] }
libc = "0.2"
ureq = { version = "3", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
qrcode = { version = "0.14", default-features = false } # Share Songs with a Phone
# a Radiance Music Server's listening party (its WebSocket); rustls, as ureq's (it builds for Windows with mingw)
tungstenite = { version = "0.29", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
# the feedback pop-up's sign-in (feedback.rs): PKCE's S256 and its random secrets
sha2 = "0.10"
getrandom = "0.3"
# the splitter without Python (owner 2026-11-02): Demucs as ONNX, as the phone runs it;
# ONNX Runtime's library is loaded at run time (not linked), so builds don't need it
ort = { version = "=2.0.0-rc.15", optional = true, default-features = false, features = ["load-dynamic", "std"] }

[features]
default = ["save-youtube"]
# Splitting inside the app (onnx_split.rs) instead of Python's Demucs: prototype, not wired yet
onnx-split = ["dep:ort"]
# Liked YouTube songs are saved as files too, with their music videos (720p)
# and lyrics: like it, save it, split it, all on your own computer. Build with
# --no-default-features for a player that only streams YouTube songs.
save-youtube = []

[profile.release]
lto = "thin"
# function names and lines kept, so a freeze's stacks (watch.rs) say where it was
debug = "line-tables-only"
strip = "none"

# Windows: GStreamer's GTK 4 video sink comes inside the app (Fedora's Windows GStreamer has none)
[target.'cfg(windows)'.dependencies]
gst-plugin-gtk4 = { version = "0.15", features = ["gtk_v4_14"] }
# Windows' media controls (media keys, the volume flyout, the lock screen), as MPRIS on Linux:
# souvlaki speaks Windows' System Media Transport Controls; gdk4-win32 gives it the window
souvlaki = { version = "0.9", default-features = false }
gdk4-win32 = "0.11"
# the notification area's icon ("system tray") while the app is open (#37); its size: the small icon's
tray-icon = { version = "0.26", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }
# the default speaker, which the music follows (#38): the same windows crate souvlaki uses
windows = { version = "0.62", features = ["Win32_Media_Audio", "Win32_System_Com"] }
# the splitter pack, downloaded at the first start (setup::install_pack): unpacked and checked
zip = { version = "9.3", default-features = false, features = ["deflate"] } # 9.0.5+: Dependabot #1-#3 (#36)
# the feedback sign-in's token: Windows' Credential Manager
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }

# Linux: the feedback sign-in's token in the Secret Service (GNOME Keyring, KWallet), pure Rust
[target.'cfg(not(windows))'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["async-secret-service", "async-io", "crypto-rust"] }
