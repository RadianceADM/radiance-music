[package]
name = "radiance-music"
version = "0.7.12"
edition = "2021"
description = "Search any song and play it: lossless from free libraries first, YouTube Music as the fallback; likes are saved, with synced lyrics, album art and your EQ"
license = "GPL-3.0-or-later"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }
gst = { package = "gstreamer", version = "0.25" }
gst-app = { package = "gstreamer-app", version = "0.25" }
realfft = "3.5"
async-channel = "2"
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.41", features = ["bundled"] }
libc = "0.2"
ureq = { version = "3", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
qrcode = { version = "0.14", default-features = false } # Share Songs with a Phone

[features]
default = ["save-youtube"]
# Liked YouTube songs are saved as files too, with their music videos (720p)
# and lyrics: like it, save it, split it, all on your own computer. Note that
# saving from YouTube goes against YouTube's terms of service. Build with
# --no-default-features for a player that only streams YouTube songs.
save-youtube = []

[profile.release]
lto = "thin"
# function names and lines kept, so a freeze's stacks (watch.rs) say where it was
debug = "line-tables-only"
strip = "none"

# Windows: GStreamer's GTK 4 video sink comes inside the app (Fedora's Windows GStreamer has none)
[target.'cfg(windows)'.dependencies]
gst-plugin-gtk4 = { version = "0.15", features = ["gtk_v4_14"] }
# Windows' media controls (media keys, the volume flyout, the lock screen), as MPRIS on Linux:
# souvlaki speaks Windows' System Media Transport Controls; gdk4-win32 gives it the window
souvlaki = { version = "0.9", default-features = false }
gdk4-win32 = "0.11"
# the splitter pack, downloaded at the first start (setup::install_pack): unpacked and checked
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
